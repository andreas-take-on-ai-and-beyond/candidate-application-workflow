services:
  postgres:
    container_name: bamoe-hiring-demo-postgres
    image: postgres:16.8-alpine3.21
    ports:
      - "5433:5432"
    volumes:
      - ./docker-compose/sql:/docker-entrypoint-initdb.d:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      timeout: 45s
      interval: 10s
      retries: 50
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

  pgadmin:
    container_name: bamoe-hiring-demo-pgadmin
    image: dpage/pgadmin4:9.1
    ports:
      - 8055:80
    depends_on:
      - postgres
    volumes:
      - ./docker-compose/pgadmin/servers.json:/pgadmin4/servers.json
    entrypoint: >
      /bin/sh -c "
      mkdir -p /var/lib/pgadmin &&
      printf 'postgres:5432:kie:kie-user:%s\npostgres:5432:postgres:kie-user:%s\n' \
        \"$${KIE_DB_PASSWORD}\" \"$${KIE_DB_PASSWORD}\" > /var/lib/pgadmin/pgpass &&
      chmod 600 /var/lib/pgadmin/pgpass &&
      /entrypoint.sh
      "
    environment:
      PGADMIN_DEFAULT_EMAIL: user@kie.org
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-pass}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      GUNICORN_ACCESS_LOGFILE: "/dev/null"
      KIE_DB_PASSWORD: ${KIE_DB_PASSWORD:-kie-pass}

  process-ai-prescreen-hiring:
    container_name: process-ai-prescreen-hiring
    # Locally-built image — see README Step 2 for the Maven build command.
    image: dev.local/apache/process-ai-prescreen-hiring:9.3.1-ibm-0006
    pull_policy: never
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JAVA_OPTS_APPEND: "-XX:MaxRAMPercentage=50.0 -XX:InitialRAMPercentage=10.0 -Dquarkus.jackson.fail-on-unknown-properties=false -Dquarkus.jsonb.fail-on-unknown-properties=false"
      QUARKUS_JACKSON_FAIL_ON_UNKNOWN_PROPERTIES: "false"
      QUARKUS_RESTEASY_JACKSON_FAIL_ON_UNKNOWN_PROPERTIES: "false"
      QUARKUS_JSONB_FAIL_ON_UNKNOWN_PROPERTIES: "false"
      KOGITO_JACKSON_FAIL_ON_UNKNOWN_PROPERTIES: "false"
      QUARKUS_HTTP_CORS_ORIGINS: "/.*/.*/"
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres:5432/kie_ai"
      QUARKUS_DATASOURCE_REACTIVE_URL: "postgresql://postgres:5432/kie_ai"
      QUARKUS_DATASOURCE_USERNAME: kie-user
      QUARKUS_DATASOURCE_PASSWORD: ${KIE_DB_PASSWORD:-kie-pass}
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      KOGITO_JOBS_SERVICE_URL: http://localhost:8080
      KOGITO_SERVICE_URL: http://localhost:8080
      KOGITO_DATAINDEX_HTTP_URL: http://localhost:8080
      AI_PRESCREEN_URL: ${AI_PRESCREEN_URL:-http://host.docker.internal:4321}
      ADK_AUTH_USERNAME: ${ADK_AUTH_USERNAME:-wxo.archer@ibm.com}
      ADK_AUTH_PASSWORD: ${ADK_AUTH_PASSWORD:-watsonx}
      ADK_TENANT_NAME: ${ADK_TENANT_NAME:-wxo-dev}
      # ── Demo-only role gate ─────────────────────────────────────────────────
      # OIDC is disabled (quarkus.oidc.enabled=false in application.properties).
      # The "password" values below are intentional demo placeholders for a
      # LOCAL development environment only. NEVER deploy this configuration to
      # any shared, internet-facing, or production environment.
      QUARKUS_SECURITY_USERS_EMBEDDED_ENABLED: "true"
      QUARKUS_SECURITY_USERS_EMBEDDED_USERS_RECRUITER: "password"
      QUARKUS_SECURITY_USERS_EMBEDDED_ROLES_RECRUITER: "HR,user"
      QUARKUS_SECURITY_USERS_EMBEDDED_USERS_DEVELOPER: "password"
      QUARKUS_SECURITY_USERS_EMBEDDED_ROLES_DEVELOPER: "IT,user"

  process-hiring:
    container_name: process-hiring
    image: dev.local/apache/process-hiring:${PROJECT_VERSION}
    pull_policy: never
    ports:
      - "18081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JAVA_OPTS_APPEND: "-XX:MaxRAMPercentage=50.0 -XX:InitialRAMPercentage=10.0"
      QUARKUS_HTTP_CORS_ORIGINS: "/.*/.*/"
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres:5432/kie"
      QUARKUS_DATASOURCE_REACTIVE_URL: "postgresql://postgres:5432/kie"
      QUARKUS_DATASOURCE_USERNAME: kie-user
      QUARKUS_DATASOURCE_PASSWORD: ${KIE_DB_PASSWORD:-kie-pass}
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      KOGITO_JOBS_SERVICE_URL: http://localhost:8080
      KOGITO_SERVICE_URL: http://localhost:8080
      KOGITO_DATAINDEX_HTTP_URL: http://localhost:8080

  management-console:
    container_name: bamoe-hiring-demo-management-console
    image: ${MANAGEMENT_CONSOLE_IMAGE}
    platform: linux/amd64
    ports:
      - 18280:8080
    volumes:
      - ./docker-compose/management-console/env.json:/management-console/app/env.json:Z
    depends_on:
      process-ai-prescreen-hiring:
        condition: service_started
      #process-hiring:
      #  condition: service_started
  